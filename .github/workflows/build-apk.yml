name: Build Android APK

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install sharp

      - name: Generate icons
        run: |
          node << 'JSEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          async function main() {
            const svg = fs.readFileSync('icon.svg');
            await sharp(svg).resize(512,512).png().toFile('icon-512.png');
            await sharp(svg).resize(192,192).png().toFile('icon-192.png');
            console.log('Icons OK');
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp datos.html www/index.html
          cp domicilio.html www/domicilio.html 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp icon-512.png www/ 2>/dev/null || true
          cp icon-192.png www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Write network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XMLEOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
  <base-config cleartextTrafficPermitted="true">
    <trust-anchors>
      <certificates src="system" />
    </trust-anchors>
  </base-config>
</network-security-config>
XMLEOF

      - name: Patch AndroidManifest
        run: |
          python3 << 'PYEOF'
          f = 'android/app/src/main/AndroidManifest.xml'
          c = open(f).read()
          print('BEFORE:', c[:500])
          c = c.replace(
            'android:supportsRtl="true"',
            'android:supportsRtl="true" android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"'
          )
          open(f, 'w').write(c)
          print('AFTER:', open(f).read()[:500])
          print('AndroidManifest patched OK')
          PYEOF

      - name: Copy icons to Android resources
        run: |
          node << 'JSEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          async function main() {
            const svg = fs.readFileSync('icon.svg');
            const sizes = [
              {dir:'mipmap-mdpi',s:48},{dir:'mipmap-hdpi',s:72},
              {dir:'mipmap-xhdpi',s:96},{dir:'mipmap-xxhdpi',s:144},
              {dir:'mipmap-xxxhdpi',s:192}
            ];
            for (const {dir, s} of sizes) {
              const path = `android/app/src/main/res/${dir}`;
              fs.mkdirSync(path, {recursive:true});
              await sharp(svg).resize(s,s).png().toFile(`${path}/ic_launcher.png`);
              await sharp(svg).resize(s,s).png().toFile(`${path}/ic_launcher_round.png`);
            }
            console.log('Icons copied OK');
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
