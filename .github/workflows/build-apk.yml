name: Build Android APK

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Copy web files to www folder
        run: |
          mkdir -p www
          cp datos.html www/index.html
          cp domicilio.html www/domicilio.html 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
