name: Build APK

on:
  push:
    branches: [ main, master, claude/cool-keller-S9H3V ]
    paths:
      - 'ChispaGoApp/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle wrapper jar
        run: |
          mkdir -p ChispaGoApp/gradle/wrapper
          curl -Lo ChispaGoApp/gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar

      - name: Grant execute permission for gradlew
        run: chmod +x ChispaGoApp/gradlew

      - name: Build debug APK
        run: |
          cd ChispaGoApp
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: ChispaGoApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "ChispaGo APK #${{ github.run_number }}"
          body: "APK nativo con GPS via FusedLocationProviderClient"
          files: ChispaGoApp/app/build/outputs/apk/debug/app-debug.apk
