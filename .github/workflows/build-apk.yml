name: Build Android APK

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install sharp

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp datos.html www/index.html
          [ -f domicilio.html ] && cp domicilio.html www/domicilio.html || true
          for f in *.css; do [ -f "$f" ] && cp "$f" www/ || true; done
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          echo "www contents:"; ls www/

      - name: Add Android platform
        run: npx cap add android

      - name: Write network_security_config.xml
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'EOF'
<?xml version="1.0" encoding="utf-8"?>
<network-security-config>
  <base-config cleartextTrafficPermitted="true">
    <trust-anchors>
      <certificates src="system" />
    </trust-anchors>
  </base-config>
</network-security-config>
EOF

      - name: Patch AndroidManifest.xml
        run: |
          python3 - << 'PYEOF'
          import re
          f = 'android/app/src/main/AndroidManifest.xml'
          content = open(f).read()
          if 'networkSecurityConfig' not in content:
              patched = content.replace(
                  'android:supportsRtl="true"',
                  'android:supportsRtl="true"\n        android:networkSecurityConfig="@xml/network_security_config"\n        android:usesCleartextTraffic="true"'
              )
              if patched == content:
                  patched = re.sub(
                      r'(<application\b)',
                      r'\1\n        android:networkSecurityConfig="@xml/network_security_config"\n        android:usesCleartextTraffic="true"',
                      content, count=1
                  )
              open(f, 'w').write(patched)
              print('Manifest patched OK')
          else:
              print('Already patched')
          print('CHECK:', 'networkSecurityConfig' in open(f).read())
          PYEOF

      - name: Generate and copy icons
        run: |
          node << 'JSEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          async function main() {
            const svgBuf = fs.readFileSync('icon.svg');
            const sizes = [
              { dir: 'mipmap-mdpi',    size: 48  },
              { dir: 'mipmap-hdpi',    size: 72  },
              { dir: 'mipmap-xhdpi',   size: 96  },
              { dir: 'mipmap-xxhdpi',  size: 144 },
              { dir: 'mipmap-xxxhdpi', size: 192 }
            ];
            for (const { dir, size } of sizes) {
              const dest = `android/app/src/main/res/${dir}`;
              fs.mkdirSync(dest, { recursive: true });
              const buf = await sharp(svgBuf).resize(size, size).png().toBuffer();
              fs.writeFileSync(path.join(dest, 'ic_launcher.png'), buf);
              fs.writeFileSync(path.join(dest, 'ic_launcher_round.png'), buf);
              fs.writeFileSync(path.join(dest, 'ic_launcher_foreground.png'), buf);
              console.log(dir + ' OK');
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tail -100

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
