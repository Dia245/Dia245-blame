name: Build Android APK

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install sharp

      - name: Generate icons
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('icon.svg');
          const jobs = [
            {f:'icon-512.png',s:512},{f:'icon-192.png',s:192}
          ];
          jobs.forEach(j=>sharp(svg).resize(j.s,j.s).png().toFile(j.f,e=>e&&console.error(e)));
          "
          sleep 2

      - name: Copy web files to www
        run: |
          mkdir -p www
          cp datos.html www/index.html
          cp domicilio.html www/domicilio.html 2>/dev/null || true
          cp *.css www/ 2>/dev/null || true
          cp manifest.json www/ 2>/dev/null || true
          cp icon-512.png www/ 2>/dev/null || true
          cp icon-192.png www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Add Android platform
        run: npx cap add android

      - name: Write network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/network_security_config.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system" />
              </trust-anchors>
            </base-config>
          </network-security-config>
          XMLEOF

      - name: Patch AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Add networkSecurityConfig and usesCleartextTraffic to application tag
          sed -i 's|android:label="@string/app_name"|android:label="@string/app_name" android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"|g' $MANIFEST
          cat $MANIFEST

      - name: Copy icons to Android
        run: |
          node -e "
          const sharp = require('sharp');
          const fs = require('fs');
          const svg = fs.readFileSync('icon.svg');
          const sizes = [
            {dir:'mipmap-mdpi',s:48},{dir:'mipmap-hdpi',s:72},
            {dir:'mipmap-xhdpi',s:96},{dir:'mipmap-xxhdpi',s:144},{dir:'mipmap-xxxhdpi',s:192}
          ];
          sizes.forEach(({dir,s})=>{
            fs.mkdirSync('android/app/src/main/res/'+dir,{recursive:true});
            sharp(svg).resize(s,s).png().toFile('android/app/src/main/res/'+dir+'/ic_launcher.png',e=>e&&console.error(e));
            sharp(svg).resize(s,s).png().toFile('android/app/src/main/res/'+dir+'/ic_launcher_round.png',e=>e&&console.error(e));
          });
          "
          sleep 3

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
