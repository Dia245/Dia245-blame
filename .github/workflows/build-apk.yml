name: Build APK

on:
  push:
    branches: [ main, master, claude/cool-keller-S9H3V ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install required SDK components
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" 2>/dev/null | tail -3

      - name: Set SDK path via local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > ChispaGoApp/local.properties

      - name: Build debug APK
        working-directory: ChispaGoApp
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-debug
          path: ChispaGoApp/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "ChispaGo APK #${{ github.run_number }}"
          body: "APK nativo con GPS via FusedLocationProviderClient"
          files: ChispaGoApp/app/build/outputs/apk/debug/app-debug.apk
