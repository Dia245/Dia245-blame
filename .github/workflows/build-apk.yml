name: Build Android APK

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install && npm install sharp

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp datos.html www/index.html
          [ -f domicilio.html ] && cp domicilio.html www/domicilio.html || true
          for f in *.css; do [ -f "$f" ] && cp "$f" www/ || true; done
          [ -f manifest.json ] && cp manifest.json www/ || true
          [ -f sw.js ] && cp sw.js www/ || true
          echo "www contents:"; ls www/

      - name: Add Android platform
        run: npx cap add android

      - name: Patch AndroidManifest and write network config
        run: |
          python3 - << 'PYEOF'
          import os, re

          xml_dir = 'android/app/src/main/res/xml'
          os.makedirs(xml_dir, exist_ok=True)
          xml_content = ('<?xml version="1.0" encoding="utf-8"?>\n'
              '<network-security-config>\n'
              '  <base-config cleartextTrafficPermitted="true">\n'
              '    <trust-anchors>\n'
              '      <certificates src="system" />\n'
              '    </trust-anchors>\n'
              '  </base-config>\n'
              '</network-security-config>\n')
          open(os.path.join(xml_dir, 'network_security_config.xml'), 'w').write(xml_content)
          print('network_security_config.xml written OK')

          mf = 'android/app/src/main/AndroidManifest.xml'
          content = open(mf).read()

          if 'android.permission.INTERNET' not in content:
              content = content.replace(
                  '<application',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n\n    <application',
                  1
              )

          if 'networkSecurityConfig' not in content:
              patched = content.replace(
                  'android:supportsRtl="true"',
                  'android:supportsRtl="true" android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"'
              )
              if patched == content:
                  patched = re.sub(
                      r'(<application\b)',
                      r'\1 android:networkSecurityConfig="@xml/network_security_config" android:usesCleartextTraffic="true"',
                      content, count=1
                  )
              content = patched

          open(mf, 'w').write(content)
          print('Manifest patched OK')
          print(open(mf).read())
          PYEOF

      - name: Patch MainActivity for cross-origin WebView access
        run: |
          python3 - << 'PYEOF'
          import os, glob

          matches = glob.glob('android/app/src/main/java/**/*.java', recursive=True)
          main_activity = next((f for f in matches if 'MainActivity' in f), None)
          if not main_activity:
              print('ERROR: MainActivity.java not found'); exit(1)

          content = open(main_activity).read()
          print('Found:', main_activity)

          new_imports = (
              'import android.webkit.WebSettings;\n'
              'import android.webkit.WebView;\n'
          )
          if 'android.webkit.WebSettings' not in content:
              content = content.replace(
                  'import com.getcapacitor.BridgeActivity;',
                  'import com.getcapacitor.BridgeActivity;\n' + new_imports
              )

          new_class = (
              'public class MainActivity extends BridgeActivity {\n'
              '    @Override\n'
              '    protected void onStart() {\n'
              '        super.onStart();\n'
              '        WebView webView = getBridge().getWebView();\n'
              '        WebSettings settings = webView.getSettings();\n'
              '        settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);\n'
              '        settings.setAllowFileAccessFromFileURLs(true);\n'
              '        settings.setAllowUniversalAccessFromFileURLs(true);\n'
              '        settings.setDomStorageEnabled(true);\n'
              '        settings.setJavaScriptEnabled(true);\n'
              '        WebView.setWebContentsDebuggingEnabled(true);\n'
              '    }\n'
              '}'
          )

          if 'setMixedContentMode' not in content:
              content = content.replace(
                  'public class MainActivity extends BridgeActivity {}',
                  new_class
              )
              print('MainActivity patched OK')
          else:
              print('Already patched')

          open(main_activity, 'w').write(content)
          print(open(main_activity).read())
          PYEOF

      - name: Generate and copy icons
        run: |
          node << 'JSEOF'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          async function main() {
            const svgBuf = fs.readFileSync('icon.svg');
            const sizes = [
              { dir: 'mipmap-mdpi',    size: 48  },
              { dir: 'mipmap-hdpi',    size: 72  },
              { dir: 'mipmap-xhdpi',   size: 96  },
              { dir: 'mipmap-xxhdpi',  size: 144 },
              { dir: 'mipmap-xxxhdpi', size: 192 }
            ];
            for (const { dir, size } of sizes) {
              const dest = 'android/app/src/main/res/' + dir;
              fs.mkdirSync(dest, { recursive: true });
              const buf = await sharp(svgBuf).resize(size, size).png().toBuffer();
              fs.writeFileSync(path.join(dest, 'ic_launcher.png'), buf);
              fs.writeFileSync(path.join(dest, 'ic_launcher_round.png'), buf);
              fs.writeFileSync(path.join(dest, 'ic_launcher_foreground.png'), buf);
              console.log(dir + ' OK');
            }
          }
          main().catch(e => { console.error(e); process.exit(1); });
          JSEOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tail -50

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChispaGo-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
